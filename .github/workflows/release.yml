name: Release

# Builds the vtss command line client for each platform and attaches the
# binaries and their checksums to the release of the pushed tag. install.sh
# downloads them from there.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  vtss:
    name: vtss binaries
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write # create the release if needed and upload its assets
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Build
        env:
          TAG: ${{ github.ref_name }}
        run: |
          mkdir dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            os=${target%/*}
            arch=${target#*/}
            ext=""
            if [ "$os" = windows ]; then ext=.exe; fi
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath \
              -ldflags "-s -w -X main.version=$TAG" \
              -o "dist/vtss_${os}_${arch}${ext}" ./cmd/vtss
          done
          cd dist
          sha256sum vtss_* > checksums.txt
          cat checksums.txt

      # The tag may arrive before or after its release exists (gh release
      # create pushes the tag itself), so create it only when missing.
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --title "$TAG" --notes "See CHANGELOG.md for what changed."
          fi
          gh release upload "$TAG" dist/* --clobber
