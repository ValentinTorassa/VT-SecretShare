version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    # Version updates wait a week so a compromised release has time to be
    # pulled; security updates are not delayed.
    cooldown:
      default-days: 7
    groups:
      go-modules:
        patterns: ["*"]

  # The Dockerfile's builder and runtime images.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]
