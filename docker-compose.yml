# Local stack: app + Redis. `podman compose` works the same.
services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]  # secrets are ephemeral; don't persist to disk
    restart: unless-stopped

  app:
    build: .
    ports:
      # Loopback only: WebCrypto needs a secure context, so a LAN client over
      # plain HTTP could not use the UI anyway; put HTTPS in front to share it.
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    environment:
      REDIS_ADDR: redis:6379
      BASE_URL: ${BASE_URL:-http://localhost:8080}
    depends_on:
      - redis
    restart: unless-stopped
