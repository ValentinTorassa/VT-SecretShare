<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Zero-knowledge one-time secret sharing. Encrypted in your browser, self-destructs after a single read.">
<title>VT-SecretShare // transmisión cifrada</title>
<link rel="icon" href="/web/penguin-ink.png">
<script src="/web/theme.js?v={{ASSET_VERSION}}"></script>
<link rel="stylesheet" href="/web/fx.css?v={{ASSET_VERSION}}">
</head>
<body>
<canvas id="three"></canvas>
<canvas id="matrix"></canvas>
<div class="vignette"></div>
<div class="scanlines"></div>

<div class="stage">
  <div class="panel" id="panel">
    <div class="bar">
      <span class="dot r"></span><span class="dot y"></span><span class="dot g"></span>
      <span class="brand"><span class="peng"></span><span class="wm"><b>VT</b> Security</span></span>
      <span class="toggles">
        <span class="themetog">
          <button data-theme-set="hacker">HACKER</button><span class="sep">/</span><button data-theme-set="pro">PRO</button>
        </span>
        <span class="langtog" aria-label="language">
          <button data-lang="es" aria-label="Español" title="Español">🇪🇸</button><button data-lang="en" aria-label="English" title="English">🇺🇸</button>
        </span>
      </span>
    </div>

    <h1 class="glitch" data-text="VT-SECRETSHARE">VT-SECRETSHARE</h1>
    <p class="sub"><span id="typed"></span><span class="cursor"></span></p>

    <label for="secret" data-i18n="label_secret"></label>
    <textarea id="secret" data-i18n-ph="ph_secret"></textarea>

    <label for="ttl" data-i18n="label_ttl"></label>
    <select id="ttl">
      <option value="600" data-i18n="ttl_10m"></option>
      <option value="3600" data-i18n="ttl_1h"></option>
      <option value="86400" selected data-i18n="ttl_1d"></option>
      <option value="604800" data-i18n="ttl_7d"></option>
    </select>

    <button class="btn" id="create" data-i18n="btn_create"></button>
    <div class="err" id="err"></div>

    <div class="result" id="result">
      <label data-i18n="label_link"></label>
      <div class="linkbox">
        <input id="link" readonly>
        <button class="btn copy" id="copy" data-i18n="btn_copy"></button>
      </div>
      <div class="meta" id="meta"></div>
    </div>

    <div class="foot" data-i18n-html="foot_index"></div>

    <!-- cipher animation overlay -->
    <div class="cipherfx" id="cipherfx">
      <div class="lbl" id="cipherlbl">CIFRANDO</div>
      <pre id="cipherstream"></pre>
      <div class="pbar"><i id="cipherbar"></i></div>
    </div>
  </div>
</div>

<script src="/web/matrix.js?v={{ASSET_VERSION}}"></script>
<script src="/web/i18n.js?v={{ASSET_VERSION}}"></script>
<script src="/web/anim.js?v={{ASSET_VERSION}}"></script>
<script src="/web/crypto.js?v={{ASSET_VERSION}}"></script>
<script src="/web/clipboard.js?v={{ASSET_VERSION}}"></script>
<script type="module" src="/web/vault.js?v={{ASSET_VERSION}}"></script>
<script src="/web/index.js?v={{ASSET_VERSION}}"></script>
</body>
</html>
